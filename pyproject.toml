[project]
name = "hrs-botany"
version = "0.1.0"
description = "Helper functions for hyperspectral remote sensing and botany workflows"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "bs4",
    "cartopy",
    "contextily",
    "dask-ml",
    "datashader",
    "gdal",
    "geopandas",
    "geoviews",
    "h5py",
    "holoviews",
    "hvplot",
    "ipykernel",
    "ipython",
    "ipywidgets",
    "jupyter-bokeh",
    "lightgbm",
    "matplotlib",
    "neonutilities",
    "numpy",
    "pandas",
    "pygbif",
    "pystac-client",
    "requests",
    "rioxarray",
    "scikit-image",
    "scikit-learn",
    "seaborn",
    "selenium",
    "sklearn-xarray",
    "torch",
    "webdriver-manager",
    "xarray",
    "xgboost",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hrs_botany"]

[tool.hatch.metadata]
allow-direct-references = true
